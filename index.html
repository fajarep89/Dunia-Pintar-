<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dunia Pintar</title>
<style>
:root{color-scheme:light;--ink:#2b2d42;--y:#ffd23f;--g:#4cc38a;--b:#3a86ff;--r:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9bdcff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;background:#fffd;border-radius:18px;padding:8px 14px;font-size:18px;font-weight:700;line-height:1.35;box-shadow:0 3px 0 #0002}
.bar{height:10px;background:#ddd;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g);width:0}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:56px;height:56px;border-radius:50%;border:0;background:#fffd;font-size:26px;box-shadow:0 3px 0 #0002}
#bubble{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 86px);width:min(92vw,460px);background:#fff;border:4px solid var(--y);border-radius:22px;padding:12px 16px;font-size:20px;font-weight:700;text-align:center;display:none;box-shadow:0 4px 0 #0002}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:150px;height:150px;border-radius:50%;background:#fff6;border:4px solid #fffa;touch-action:none}
#knob{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:var(--b);box-shadow:0 3px 0 #0003}
.btn{border:0;border-radius:26px;font-weight:800;color:#fff;box-shadow:0 5px 0 #0003;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
#jump{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:92px;height:92px;border-radius:50%;background:var(--g);font-size:20px}
#talk,#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);padding:16px 22px;font-size:22px;background:var(--r);display:none}
.ov{position:fixed;inset:0;background:#2b2d42cc;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
.card{background:#fff;border-radius:28px;padding:22px 18px;width:min(94vw,480px);max-height:94vh;overflow:auto;text-align:center;touch-action:auto}
.card h1{margin:0 0 6px;font-size:32px;color:var(--b)}.card p{font-size:20px;font-weight:600;margin:8px 0}
#nm{width:100%;font-size:28px;padding:14px;border-radius:18px;border:4px solid var(--y);text-align:center;font-weight:800;margin:10px 0;user-select:text;-webkit-user-select:text}
#go{padding:16px 36px;font-size:26px;background:var(--g)}
#items{font-size:44px;line-height:1.25;margin:8px 0;min-height:110px;word-break:break-all}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
#opts button{font-size:40px;padding:16px 0;background:var(--b)}
#opts button.bad{background:#999;animation:sh .3s}#opts button.ok{background:var(--g)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#close{position:absolute;top:10px;right:10px;width:54px;height:54px;border-radius:50%;background:#fff;color:var(--ink);font-size:24px;border:0;box-shadow:0 3px 0 #0003}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>
<button id="snd" aria-label="Suara">🔊</button>
<div id="bubble"></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="talk">💬 Ngobrol</button>
<button class="btn" id="jump">Lompat</button>
<button class="btn" id="act" style="background:#f4a261"></button>

<div class="ov" id="ovName" style="display:flex"><div class="card">
<h1>Dunia Pintar</h1><p>Halo! Siapa namamu?</p>
<input id="nm" maxlength="14" placeholder="Nama saya" autocomplete="off">
<button class="btn" id="go">Main! ▶</button></div></div>

<div class="ov" id="ovGame"><div class="card" style="position:relative">
<button id="close">✖</button>
<h1 id="q">Ada berapa?</h1><div id="items"></div><div id="opts"></div>
<p id="prog"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== 1. DATA & PENYIMPANAN (mudah diganti ke server nanti) ===== */
const Store={
  load(){try{return JSON.parse(localStorage.getItem('duniapintar')||'{}')}catch(e){return {}}},
  save(s){try{localStorage.setItem('duniapintar',JSON.stringify(s))}catch(e){}}
};
const S=Object.assign({name:'',stars:0,score:0,games:0},Store.load());
const level=()=>1+Math.floor(S.stars/5);
const $=id=>document.getElementById(id);

/* ===== 2. SUARA (Text-to-Speech Indonesia; ganti isi speak() untuk audio rekaman) ===== */
const Voice={on:true,speak(t){
  if(!this.on||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.9;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}
}};
$('snd').onclick=()=>{Voice.on=!Voice.on;$('snd').textContent=Voice.on?'🔊':'🔇';if(!Voice.on)try{speechSynthesis.cancel()}catch(e){}};

/* ===== 3. GURU: dialog memakai nama anak ===== */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const Lines={
  hi:n=>`Halo ${n}! Selamat datang di Dunia Pintar! Ayo kita belajar berhitung.`,
  ask:n=>`${n}, ada berapa ya? Ayo hitung bersama!`,
  ok:n=>pick([`Benar sekali, ${n}!`,`Hebat, ${n}! Jawaban kamu benar!`,`Bagus sekali, ${n}!`]),
  no:n=>pick([`Hampir benar, ${n}. Yuk coba lagi.`,`Tidak apa-apa, ${n}. Coba lagi ya.`,`Jangan menyerah, ${n}. Coba sekali lagi.`]),
  done:n=>`Hebat, ${n}! Satu permainan selesai. Kamu mendapat bintang!`,
  up:(n,l)=>`Selamat ${n}! Kamu naik ke level ${l}!`,
  near:(n,m)=>`Hai ${n}! Ketuk Ngobrol untuk ${m}.`
};
let bt;
function say(t,ms=4500){const b=$('bubble');b.textContent='🧑‍🏫 '+t;b.style.display='block';Voice.speak(t);clearTimeout(bt);bt=setTimeout(()=>b.style.display='none',ms)}

/* ===== 4. HUD ===== */
function hud(){
  const p=(S.stars%5)/5*100;
  $('hud').innerHTML=`${S.name}<br>Level ${level()} &nbsp;⭐ ${S.stars}<br>🏆 ${S.games} permainan &nbsp;🎁 ${Math.floor(S.stars/5)}<div class="bar"><i style="width:${p}%"></i></div>`;
  Store.save(S);
}

/* ===== 5. MINI GAME BERHITUNG ===== */
const OldCount={emo:['🍎','🍌','🎈','🐟','⭐','🍓'],round:0,need:5,ans:0,lock:false,
  start(){this.round=0;$('ovGame').style.display='flex';this.next()},
  next(){
    this.lock=false;const max=Math.min(4+level()*2,10);
    this.ans=1+Math.floor(Math.random()*max);
    const e=pick(this.emo);$('items').textContent=(e+' ').repeat(this.ans).trim();
    $('q').textContent='Ada berapa '+e+' ?';
    const pool=[];for(let v=1;v<=max+2;v++)if(v!==this.ans)pool.push(v);pool.sort((a,b)=>Math.abs(a-this.ans)-Math.abs(b-this.ans)||Math.random()-.5);const set=new Set([this.ans,...pool.slice(0,3)]);
    const o=$('opts');o.innerHTML='';
    [...set].sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement('button');b.className='btn';b.textContent=v;b.onclick=()=>this.choose(v,b);o.appendChild(b)});
    $('prog').textContent=`Soal ${this.round+1} dari ${this.need}`;
    say(Lines.ask(S.name),3000);
  },
  choose(v,b){
    if(this.lock)return;
    if(v===this.ans){
      this.lock=true;b.classList.add('ok');
      const l0=level();S.stars++;S.score+=10;this.round++;
      let t=Lines.ok(S.name);
      if(this.round>=this.need){S.games++;t=Lines.done(S.name)}
      if(level()>l0)t+=' '+Lines.up(S.name,level());
      hud();say(t,4000);
      setTimeout(()=>this.round>=this.need?this.end():this.next(),2200);
    }else{b.classList.add('bad');b.disabled=true;say(Lines.no(S.name),3000)}
  },
  end(){$('ovGame').style.display='none';$('bubble').style.display='none'}
};
$('close').onclick=()=>Count.end();
let curNpc=null,act=null,onTop=false;
const L8=['A','K','I','P','G','B','S','M'];
const G={
 hitung:()=>{const max=Math.min(4+level()*2,10),a=1+Math.floor(Math.random()*max),e=pick(['🍎','🍌','🎈','🐟','⭐','🍓']);const pool=[];for(let v=1;v<=max+2;v++)if(v!==a)pool.push(v);pool.sort(()=>Math.random()-.5);return{q:'Ada berapa '+e+' ?',show:(e+' ').repeat(a).trim(),ans:a,opts:[a,...pool.slice(0,3)]}},
 huruf:()=>{const w=pick([['🍎','Apel','A'],['🐱','Kucing','K'],['🐟','Ikan','I'],['🍌','Pisang','P'],['🐘','Gajah','G'],['🦆','Bebek','B'],['🐄','Sapi','S'],['🚗','Mobil','M']]);return{q:w[1]+' dimulai huruf apa?',show:w[0],ans:w[2],opts:[w[2],...L8.filter(x=>x!==w[2]).sort(()=>Math.random()-.5).slice(0,3)]}},
 warna:()=>{const A=[['🔴','Merah'],['🟡','Kuning'],['🟢','Hijau'],['🔵','Biru'],['🟠','Oranye'],['🟣','Ungu']],w=pick(A);return{q:'Warna apa ini?',show:w[0],ans:w[1],opts:[w[1],...A.filter(x=>x[1]!==w[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])]}},
 bentuk:()=>{const A=[['🟦','Persegi'],['🔺','Segitiga'],['⭐','Bintang'],['❤️','Hati'],['⚫','Lingkaran']],w=pick(A);return{q:'Bentuk apa ini?',show:w[0],ans:w[1],opts:[w[1],...A.filter(x=>x[1]!==w[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])]}}
};
const Count={g:'hitung',round:0,need:5,ans:null,lock:false,
 start(g){this.g=G[g]?g:'hitung';this.round=0;$('ovGame').style.display='flex';this.next()},
 next(){this.lock=false;const d=G[this.g]();this.ans=d.ans;$('q').textContent=d.q;$('items').textContent=d.show;const o=$('opts');o.innerHTML='';
  d.opts.sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement('button');b.className='btn';b.textContent=v;b.style.fontSize=String(v).length>3?'26px':'40px';b.onclick=()=>this.choose(v,b);o.appendChild(b)});
  $('prog').textContent=`Soal ${this.round+1} dari ${this.need}`;say(S.name+', '+d.q,3000)},
 choose(v,b){if(this.lock)return;
  if(v===this.ans){this.lock=true;b.classList.add('ok');const l0=level();S.stars++;S.score+=10;this.round++;let t=Lines.ok(S.name);
   if(this.round>=this.need){S.games++;t=Lines.done(S.name)}
   if(level()>l0)t+=' '+Lines.up(S.name,level());hud();say(t,4000);
   setTimeout(()=>this.round>=this.need?this.end():this.next(),2200)}
  else{b.classList.add('bad');b.disabled=true;say(Lines.no(S.name),3000)}},
 end(){$('ovGame').style.display='none';$('bubble').style.display='none'}};
$('talk').onclick=()=>Count.start(curNpc&&curNpc.game);

/* ===== 6. DUNIA 3D ===== */
const cv=$('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:false});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bdcff);scene.fog=new THREE.Fog(0x9bdcff,35,85);
const cam=new THREE.PerspectiveCamera(55,1,.1,150);
scene.add(new THREE.HemisphereLight(0xffffff,0x88aa77,.95));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,10);scene.add(sun);
function fit(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

const solids=[]; // {x,z,r} tabrakan sederhana
const M={};const mat=c=>M[c]||(M[c]=new THREE.MeshLambertMaterial({color:c}));
function box(w,h,d,c,x,y,z,p=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);p.add(m);return m}
function solid(x,z,r){solids.push({x,z,r})}

// tanah, jalan, jalur
box(100,.2,100,0x7ddc6f,0,-.1,0);
box(100,.05,7,0x555a66,0,.02,2);       // jalan utama
for(let x=-45;x<45;x+=6)box(2.5,.06,.4,0xffffff,x,.06,2);
box(6,.05,60,0x555a66,-20,.02,-20);    // jalan samping

function building(x,z,w,d,h,wall,roof,label){
  box(w,h,d,wall,x,h/2,z);
  const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,h*.45,4),mat(roof));r.position.set(x,h+h*.22,z);r.rotation.y=Math.PI/4;scene.add(r);
  box(2,2.6,.2,0x8a5a2b,x,1.3,z+d/2+.05);
  for(let i=-1;i<=1;i+=2)box(1.6,1.6,.2,0xbfe9ff,x+i*w*.28,h*.6,z+d/2+.05);
  solid(x,z,Math.max(w,d)*.55);
}
building(6,-16,16,9,7,0xffd166,0xe63946);   // sekolah
building(-24,-10,8,7,5,0xf4a261,0x8d5a3b);   // rumah
building(26,-12,10,8,6,0x74c0fc,0x364fc7);   // perpustakaan

function tree(x,z){box(.8,2.4,.8,0x8a5a2b,x,1.2,z);const s=new THREE.Mesh(new THREE.SphereGeometry(1.8,8,6),mat(0x2f9e44));s.position.set(x,3.6,z);scene.add(s);solid(x,z,1)}
[[-12,10],[-16,8],[-8,12],[14,12],[18,9],[22,14],[-30,6],[34,6],[-34,-26],[36,-26],[0,-30],[-12,-28]].forEach(p=>tree(...p));
// taman bunga
for(let i=0;i<30;i++){const c=pick([0xff6b6b,0xffd23f,0xff8fab,0xffffff]);box(.4,.4,.4,c,-18+Math.random()*10,.2,13+Math.random()*8)}
// tempat bermain: perosotan, ayunan, jungkat-jungkit
const pg=new THREE.Group();pg.position.set(20,0,-26);scene.add(pg);
box(1.5,3.5,3,0xff6b6b,0,1.75,0,pg);const sl=box(1.5,.3,5.94,0xffd23f,0,1.8,4,pg);sl.rotation.x=.57;
box(.15,3.6,.15,0x8a5a2b,-.5,1.8,-1.75,pg);box(.15,3.6,.15,0x8a5a2b,.5,1.8,-1.75,pg);for(let i=0;i<7;i++)box(1.1,.12,.12,0x8a5a2b,0,.45+i*.5,-1.75,pg);
box(.3,3.5,.3,0x3a86ff,5,1.75,-1,pg);box(.3,3.5,.3,0x3a86ff,8,1.75,-1,pg);box(3.3,.3,.3,0x3a86ff,6.5,3.5,-1,pg);
box(.2,2,.2,0x666,5.8,2.4,-1,pg);box(1.2,.2,.8,0xff6b6b,5.8,1.4,-1,pg);
const sw=box(5,.3,1,0x9b5de5,0,.9,9,pg);sw.rotation.z=.15;box(.5,.9,.8,0x666,0,.45,9,pg);
solid(20,-26,1.9);

// papan penunjuk dari canvas teks
function sign(t,x,z){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,256,64);g.fillStyle='#2b2d42';g.font='bold 34px sans-serif';g.textAlign='center';g.fillText(t,128,44);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(5,1.25),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));m.position.set(x,2.6,z);scene.add(m)}
sign('SEKOLAH',6,-11.3);sign('RUMAH',-24,-6.3);sign('PERPUSTAKAAN',26,-7.7);sign('TAMAN',-14,12);sign('TEMPAT BERMAIN',23,-21);

/* ===== 7. KARAKTER ===== */
function person(shirt,skin,hair){
  const g=new THREE.Group();
  box(.9,1.1,.5,shirt,0,1.55,0,g);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.5,12,10),mat(skin));h.position.y=2.55;g.add(h);
  const hr=new THREE.Mesh(new THREE.SphereGeometry(.53,12,8,0,Math.PI*2,0,Math.PI*.5),mat(hair));hr.position.y=2.62;g.add(hr);
  box(.12,.12,.1,0x222222,-.18,2.55,.46,g);box(.12,.12,.1,0x222222,.18,2.55,.46,g);
  const limb=(w,c,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);box(w,1,w,c,0,-.5,0,p);g.add(p);return p};
  g.arms=[limb(.3,skin,-.62,2.05),limb(.3,skin,.62,2.05)];
  g.legs=[limb(.38,0x264653,-.22,1.0),limb(.38,0x264653,.22,1.0)];
  return g;
}
const me=person(0x3a86ff,0xf1c27d,0x222222);me.position.set(0,0,10);scene.add(me);
const teacher=person(0xe63946,0xf1c27d,0x6b3e26);teacher.position.set(2,0,-5);teacher.rotation.y=0;scene.add(teacher);solid(2,-5,.9);
const mark=new THREE.Mesh(new THREE.ConeGeometry(.4,.8,4),mat(0xffd23f));mark.rotation.x=Math.PI;scene.add(mark);
const npcs=[{g:teacher,m:mark,game:'hitung',msg:'belajar berhitung'}];
[[0xff9f1c,26,-5.5,'huruf','belajar huruf'],[0x9b5de5,-24,-4.5,'warna','belajar warna'],[0x2a9d8f,-13,15,'bentuk','belajar bentuk']].forEach(([c,x,z,game,msg])=>{const g=person(c,0xe0ac69,0x222222);g.position.set(x,0,z);scene.add(g);solid(x,z,.9);const m=new THREE.Mesh(new THREE.ConeGeometry(.4,.8,4),mat(0xffd23f));m.rotation.x=Math.PI;scene.add(m);npcs.push({g,m,game,msg})});
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function go(type,pts,times){act={type,pts,times,i:0,t:0}}
$('act').onclick=()=>{if(act)return;if(onTop){onTop=false;go('slide',[V(20,3.5,-26.2),V(20,3.5,-24.5),V(20,.3,-19.5),V(20,0,-18.2)],[.4,1.3,.4])}else go('climb',[me.position.clone(),V(20,0,-28.4),V(20,3.5,-28.4),V(20,3.5,-26.2)],[.4,1.4,.5])};
let camYaw=0,camH=9,camD=11;const ptr={};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr[e.pointerId]={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{const p=ptr[e.pointerId];if(!p)return;const ids=Object.keys(ptr);
 if(ids.length===2){const o=ptr[ids.find(k=>k!=e.pointerId)],d0=Math.hypot(p.x-o.x,p.y-o.y);p.x=e.clientX;p.y=e.clientY;camD=Math.max(6,Math.min(24,camD-(Math.hypot(p.x-o.x,p.y-o.y)-d0)*.05))}
 else{camYaw-=(e.clientX-p.x)*.008;camH=Math.max(3,Math.min(20,camH+(e.clientY-p.y)*.05));p.x=e.clientX;p.y=e.clientY}});
const pu=e=>{delete ptr[e.pointerId]};cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);

/* ===== 8. KONTROL (joystick sentuh + keyboard) ===== */
const inp={x:0,y:0,jump:false};const keys={};
const joy=$('joy'),knob=$('knob');let jid=null;
function jmove(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+75),dy=e.clientY-(r.top+75);const m=Math.hypot(dx,dy),max=60;if(m>max){dx*=max/m;dy*=max/m}
  knob.style.transform=`translate(${dx}px,${dy}px)`;inp.x=dx/max;inp.y=dy/max}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;inp.x=inp.y=0;knob.style.transform=''}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
$('jump').addEventListener('pointerdown',()=>inp.jump=true);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')inp.jump=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

/* ===== 9. LOOP ===== */
let vy=0,t0=performance.now(),walk=0,started=false;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-t0)/1000,.05);t0=now;const t=now/1000;
  const busy=$('ovGame').style.display==='flex'||!started||act||onTop;
  let ix=inp.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
  let iy=inp.y+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
  const mag=Math.min(Math.hypot(ix,iy),1);
  if(!busy&&mag>.1){
    const sp=(mag>.85?8:5)*dt;const l=Math.hypot(ix,iy),ux=ix/l,uz=iy/l,cy=Math.cos(camYaw),sy=Math.sin(camYaw),nx=ux*cy+uz*sy,nz=-ux*sy+uz*cy;
    me.position.x+=nx*sp*mag/Math.max(mag,.01)*Math.min(mag*1.2,1);me.position.z+=nz*sp*Math.min(mag*1.2,1);
    me.rotation.y=Math.atan2(nx,nz);walk+=dt*(mag>.85?14:9);
  }else walk*=.9;
  if(inp.jump&&me.position.y<=.001&&!busy)vy=8;inp.jump=false;
  if(!act&&!onTop){vy-=22*dt;me.position.y=Math.max(0,me.position.y+vy*dt);if(me.position.y===0)vy=Math.max(vy,0)}
  me.position.x=Math.max(-46,Math.min(46,me.position.x));me.position.z=Math.max(-46,Math.min(46,me.position.z));
  for(const s of solids){const dx=me.position.x-s.x,dz=me.position.z-s.z,d=Math.hypot(dx,dz),r=s.r+.5;if(d<r&&d>0){me.position.x=s.x+dx/d*r;me.position.z=s.z+dz/d*r}}
  if(act){const a=act.pts[act.i],b=act.pts[act.i+1],f=Math.min(act.t/act.times[act.i],1);act.t+=dt;me.position.set(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,a.z+(b.z-a.z)*f);if(Math.hypot(b.x-a.x,b.z-a.z)>.01)me.rotation.y=Math.atan2(b.x-a.x,b.z-a.z);if(act.type==='climb')walk+=dt*10;
 if(f>=1){act.i++;act.t=0;if(act.i>=act.times.length){onTop=act.type==='climb';act=null;vy=0}}}
const sw=Math.sin(walk)*.7;me.legs[0].rotation.x=sw;me.legs[1].rotation.x=-sw;me.arms[0].rotation.x=-sw;me.arms[1].rotation.x=sw;
if(act&&act.type==='slide'){me.legs[0].rotation.x=me.legs[1].rotation.x=-1.4;me.arms[0].rotation.x=me.arms[1].rotation.x=-2.8}
  // guru menghadap anak
  teacher.rotation.y=Math.atan2(me.position.x-teacher.position.x,me.position.z-teacher.position.z);
  mark.position.set(teacher.position.x,4.3+Math.sin(t*3)*.25,teacher.position.z);mark.rotation.y=t*2;
  curNpc=null;for(const n of npcs){const dx=me.position.x-n.g.position.x,dz=me.position.z-n.g.position.z;n.g.rotation.y=Math.atan2(dx,dz);n.m.position.set(n.g.position.x,4.3+Math.sin(t*3)*.25,n.g.position.z);n.m.rotation.y=t*2;if(Math.hypot(dx,dz)<4.5)curNpc=n}
  const near=!!curNpc;
  $('talk').style.display=(near&&!busy)?'block':'none';
  const ab=$('act');ab.style.display='none';if(!act&&started){if(onTop){ab.style.display='block';ab.textContent='🛝 Merosot!'}else if(!busy&&me.position.y<.5&&Math.hypot(me.position.x-20,me.position.z+28.4)<3){ab.style.display='block';ab.textContent='🪜 Naik tangga'}}
  if(near&&!busy&&!loop.was&&started)say(Lines.near(S.name,curNpc.msg),3500);loop.was=near;
  // kamera
  const tx=me.position.x+Math.sin(camYaw)*camD,tz=me.position.z+Math.cos(camYaw)*camD,k=Math.min(1,dt*6);cam.position.x+=(tx-cam.position.x)*k;cam.position.z+=(tz-cam.position.z)*k;cam.position.y+=(me.position.y+camH-cam.position.y)*k;
  cam.lookAt(me.position.x,me.position.y+1.5,me.position.z);
  R.render(scene,cam);
}
requestAnimationFrame(loop);

/* ===== 10. MULAI ===== */
function begin(){
  const n=($('nm').value||'').trim();if(!n){$('nm').focus();return}
  S.name=n[0].toUpperCase()+n.slice(1);$('ovName').style.display='none';started=true;hud();say(Lines.hi(S.name),5500);
}
$('go').onclick=begin;$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});
if(S.name){$('nm').value=S.name}
hud();
</script>
